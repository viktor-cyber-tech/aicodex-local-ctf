<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Kali terminal showing AICodex layered decoding command and flag output">
  <rect width="1200" height="440" rx="18" fill="#0d1117"/>
  <rect width="1200" height="46" rx="18" fill="#161b22"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="104" y="29" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">kali@ctf-lab: ~/aicodex</text>
  <text x="32" y="91" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">$</text>
  <text x="54" y="91" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">echo "1f8b0800…6302721000000" | xxd -r -p | gzip -d | base64 -d | tr 'a-zA-Z' 'n-za-mN-ZA-M'</text>
  <text x="32" y="141" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">flag{final_boss_passed}</text>
  <text x="32" y="214" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Verified locally: hex → gzip → Base64 → ROT13</text>
  <line x1="32" y1="250" x2="1168" y2="250" stroke="#30363d"/>
  <text x="32" y="300" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">AICodex role: generate the pipeline</text>
  <text x="32" y="334" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Terminal role: execute and verify the result</text>
</svg>
